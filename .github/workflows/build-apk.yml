name: Build JARVIS APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract ZIP if present
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Extracting: $ZIP_FILE"
            unzip -o "$ZIP_FILE"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Locate Android Project Root
        id: locate-dir
        run: |
          SETTINGS_PATH=$(find . -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS_PATH" ]; then
            echo "settings.gradle not found!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_PATH")
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Fix Memory and Wrapper
        run: |
          TARGET_DIR="${{ steps.locate-dir.outputs.dir }}"
          cd "$TARGET_DIR"

          # Wrapper jar ensure karo
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            mkdir -p gradle/wrapper
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi

          # Safe JVM memory config (prevents runner OOM crash)
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties

          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd "${{ steps.locate-dir.outputs.dir }}"
          ./gradlew assembleDebug --no-daemon --no-build-cache

      - name: Find and Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
