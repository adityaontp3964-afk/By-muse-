name: Build JARVIS APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract ZIP if present
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            unzip -o "$ZIP_FILE"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Locate Android Directory
        id: locate
        run: |
          SETTINGS_PATH=$(find . -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS_PATH" ]; then
            echo "settings.gradle missing"
            exit 1
          fi
          echo "dir=$(dirname "$SETTINGS_PATH")" >> $GITHUB_OUTPUT

      - name: Patch Kotlin Syntax Bugs
        run: |
          TARGET_DIR="${{ steps.locate.outputs.dir }}"
          SCREENS=$(find "$TARGET_DIR" -name "Screens.kt" | head -n 1)
          if [ -n "$SCREENS" ]; then
            # Fix Modifier.height(24) -> Modifier.height(24.dp)
            sed -i -E 's/Modifier\.height\(([0-9]+)\)/Modifier.height(\1.dp)/g' "$SCREENS"
            # Fix Spacer(Modifier.height(X))
            sed -i -E 's/\.height\(([0-9]+)\)/.height(\1.dp)/g' "$SCREENS"
            # Fix padding(20) -> padding(20.dp)
            sed -i -E 's/\.padding\(([0-9]+)\)/.padding(\1.dp)/g' "$SCREENS"
          fi

      - name: Setup Wrapper and Memory
        run: |
          TARGET_DIR="${{ steps.locate.outputs.dir }}"
          cd "$TARGET_DIR"

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            mkdir -p gradle/wrapper
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi

          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=true" >> gradle.properties

          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd "${{ steps.locate.outputs.dir }}"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
