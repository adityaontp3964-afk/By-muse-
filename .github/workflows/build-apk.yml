name: Build JARVIS APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract ZIP if present
        run: |
          # Agar repo me koi bhi .zip file hai toh extract kar lo
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -n "$ZIP_FILE" ]; then
            echo "Found zip file: $ZIP_FILE. Extracting..."
            unzip -o "$ZIP_FILE"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Locate Android Project Root
        id: locate-dir
        run: |
          # settings.gradle ya settings.gradle.kts ko khoj kar actual folder path set karega
          SETTINGS_PATH=$(find . -name "settings.gradle*" | head -n 1)
          if [ -z "$SETTINGS_PATH" ]; then
            echo "ERROR: settings.gradle(.kts) nahi mila repo me!"
            ls -la
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_PATH")
          echo "Android project located at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Verify Gradle Wrapper & Permissions
        run: |
          TARGET_DIR="${{ steps.locate-dir.outputs.dir }}"
          cd "$TARGET_DIR"

          # Wrapper jar download agar missing ho
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Downloading gradle-wrapper.jar..."
            mkdir -p gradle/wrapper
            curl -sSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          fi

          # gradlew ko execute permission
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd "${{ steps.locate-dir.outputs.dir }}"
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Find and Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
